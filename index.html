<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banza — Votre assistant intelligent</title>
  <meta name="description"
    content="Banza : assistant conversationnel moderne. Posez une question, demandez une analyse, écrivez du code." />
  <link rel="icon" type="image/png" href="/logo-banza-blue.png" />
  <link rel="apple-touch-icon" href="/logo-banza-ai.png" />

  <!-- Thème clair / sombre initial sans scintillement (FOUC) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("banza-theme");
        var dark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { }
    })();
  </script>

  <!-- Polices Google Fonts : Atomic Age & Bricolage Grotesque -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Atomic+Age&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
    rel="stylesheet" />
</head>

<body class="antialiased font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
